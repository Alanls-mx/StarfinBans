# Tipos de armazenamento: "mysql", "sqlite", "memory"
# sqlite: Cria um arquivo database.db na pasta do plugin (Persistente, não precisa instalar nada)
# memory: Perde tudo ao reiniciar (Apenas para testes)
storage-type: "sqlite"

# BungeeCord gera sua identidade de instalacao no primeiro inicio e imprime
# um codigo de ativacao no console. Vincule-o a um servidor no painel Web.
# Spigot usa a identidade mantida pelo StarfinCore.
license:
  site-url: "https://starfinplugins.com.br"
  installation-id: ""
  credential: ""

database:
  host: "localhost"
  port: 3306
  database: "starfinbans"
  user: "starfinbans"
  password: ""
  use-ssl: false
  pool-size: 5
  connection-timeout: 10000

web-api:
  enabled: false
  base-url: ""
  api-key: ""
  timeout: 5000
  send-on-create: true
  send-on-update: true
  send-on-expire: true

options:
  allow-offline-punish: true
  broadcast-bans: true
  broadcast-mutes: false
  # Se true, bloqueia login se o IP estiver banido, mesmo que o Nick seja diferente
  block-ip-on-login: true
