  player-only: "&cApenas jogadores podem executar este comando."
  ip-required: "&cEste comando requer um jogador online ou um IP valido."
  invalid-time: "&cFormato de tempo invalido. Exemplos: 1d, 12h, 30m."
  not-punished: "&cO jogador &e%player% &cnao possui punicoes ativas deste tipo."

  # Uso correto
  usage:
    ban: "&cUso correto: /ban <jogador> <motivo>"
    tempban: "&cUso correto: /tempban <jogador> <tempo> <motivo>"
    ipban: "&cUso correto: /ipban <jogador/IP> <motivo>"
    tempipban: "&cUso correto: /tempipban <jogador/IP> <tempo> <motivo>"
    mute: "&cUso correto: /mute <jogador> <motivo>"
    tempmute: "&cUso correto: /tempmute <jogador> <tempo> <motivo>"
    ipmute: "&cUso correto: /ipmute <jogador/IP> <motivo>"
    tempipmute: "&cUso correto: /tempipmute <jogador/IP> <tempo> <motivo>"
    kick: "&cUso correto: /kick <jogador> <motivo>"
    warn: "&cUso correto: /warn <jogador> <motivo>"
    unban: "&cUso correto: /unban <jogador>"
    unmute: "&cUso correto: /unmute <jogador>"
    unwarn: "&cUso correto: /unwarn <jogador>"
    history: "&cUso correto: /history <jogador>"
    dupeip: "&cUso correto: /dupeip <jogador>"
    changereason: "&cUso correto: /changereason <id> <novo motivo>"
    help: "&cUso correto: /help"

# Notificacoes para o staff (quem aplicou a punicao)
notification:
  ban: "&a[Staff] Voce baniu %player% permanentemente."
  tempban: "&a[Staff] Voce baniu %player% por %duration%."
  ipban: "&a[Staff] Voce baniu o IP de %player%."
  tempipban: "&a[Staff] Voce baniu temporariamente o IP de %player% por %duration%."
  mute: "&a[Staff] Voce mutou %player%."
  tempmute: "&a[Staff] Voce mutou %player% por %duration%."
  ipmute: "&a[Staff] Voce mutou o IP de %player%."
  tempipmute: "&a[Staff] Voce mutou temporariamente o IP de %player% por %duration%."
  kick: "&a[Staff] Voce expulsou %player%."
  warn: "&a[Staff] Voce alertou %player%."
  unban: "&a[Staff] Voce desbaniu %player%."
  unmute: "&a[Staff] Voce desmutou %player%."
  unwarn: "&a[Staff] Voce removeu os alertas de %player%."
  changereason: "&a[Staff] Motivo da punicao #%id% alterado para: %reason%"

# Mensagens para o alvo (quem sofreu a punicao)
target:
  muted: "&cVoce foi mutado por &f%staff%&c. Motivo: &f%reason%"
  warned:
    - "&8&m------------------------------"
    - "&c&lVOCE RECEBEU UM AVISO"
    - "&eMotivo: &f%reason%"
    - "&eStaff: &f%staff%"
    - "&8&m------------------------------"

# Layouts de tela (Kick/Login)
layouts:
  ban:
    - "&c&lSUA CONTA ESTA BANIDA"
    - ""
    - "&7Motivo: &f%reason%"
    - "&7Staff: &f%staff%"
    - "&7Duracao: &fPermanente"
  tempban:
    - "&c&lBANIMENTO TEMPORARIO"
    - ""
    - "&7Motivo: &f%reason%"
    - "&7Staff: &f%staff%"
    - "&7Expira em: &f%expires%"
  ipban:
    - "&c&lSEU IP ESTA BANIDO"
    - ""
    - "&7Este endereco IP foi bloqueado."
    - "&7Motivo: &f%reason%"
  tempipban:
    - "&c&lSEU IP ESTA BANIDO TEMPORARIAMENTE"
    - ""
    - "&7Este endereco IP foi bloqueado."
    - "&7Motivo: &f%reason%"
    - "&7Expira em: &f%expires%"
  kick:
    - "&c&lVOCE FOI EXPULSO"
    - ""
    - "&7Motivo: &f%reason%"
    - "&7Staff: &f%staff%"
  lockdown:
    - "&c&lMANUTENCAO"
    - ""
    - "&7O servidor esta fechado no momento."

# Broadcast (anuncio global)
broadcast:
  ban:
    - ""
    - "&c&lBANIMENTO &7(Perm)"
    - "&eJogador: &f%player%"
    - "&eStaff: &f%staff%"
    - "&eMotivo: &f%reason%"
    - ""
  tempban:
    - ""
    - "&c&lBANIMENTO TEMPORARIO"
    - "&eJogador: &f%player%"
    - "&eDuracao: &f%duration%"
    - "&eStaff: &f%staff%"
    - "&eMotivo: &f%reason%"
    - ""
  ipban:
    - "&c&lIP BANIDO"
    - "&eJogador: &f%player%"
    - "&eStaff: &f%staff%"
  tempipban:
    - "&c&lIP BANIDO TEMP"
    - "&eJogador: &f%player%"
    - "&eDuracao: &f%duration%"
    - "&eStaff: &f%staff%"
  mute:
    - "&c&lMUTE"
    - "&eJogador: &f%player%"
    - "&eMotivo: &f%reason%"
  tempmute:
    - "&c&lTEMP MUTE"
    - "&eJogador: &f%player%"
    - "&eDuracao: &f%duration%"
    - "&eMotivo: &f%reason%"
  ipmute:
    - "&c&lIP MUTE"
    - "&eJogador: &f%player%"
  tempipmute:
    - "&c&lIP MUTE TEMP"
    - "&eJogador: &f%player%"
    - "&eDuracao: &f%duration%"
  kick:
    - "&e%player% &ffoi expulso por &c%staff%&f."
  warn:
    - "&e%player% &frecebeu um aviso de &c%staff%&f."
  changereason:
    - "&eMotivo da punicao #%id% alterado por &c%staff%&e."
    - "&eNovo motivo: &f%reason%"

# Historico e informacoes
history:
  header: "&8&m-----&r &eHistorico: %player% &8&m-----"
  format: "&7#%id% &f%type% &7- %reason% &8(%time_ago%) %active%"
  empty: "&7Nenhum historico encontrado."

check:
  header: "&8&m-----&r &eInformacoes de %player% &8&m-----"
  banned: "&c[BANIDO] &fMotivo: %reason% &7(Por: %staff%)"
  muted: "&c[MUTADO] &fMotivo: %reason% &7(Por: %staff%)"
  clean: "&aO jogador nao possui punicoes ativas deste tipo."

dupeip:
  scanning: "&eProcurando contas associadas..."
  header: "&8&m-----&r &eContas no mesmo IP: %ip% &8&m-----"
  format: "&7- &f%player% &7(%status%)"

help:
  header: "&8&m-----&r &eAjuda StarfinBans &8&m-----"
  format: "&e/%command% &7- %description%"

permissions:
  no-permission-general: "&cVoce nao tem permissao para executar este comando."

admin:
  reload: "&aConfiguracao e mensagens recarregadas."
  lockdown-enable: "&cLOCKDOWN ATIVADO! Apenas staff pode entrar."
  lockdown-disable: "&aLockdown desativado."
